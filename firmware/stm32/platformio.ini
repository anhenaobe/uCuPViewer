[env:nucleo_l432kc]
platform = ststm32@19.5.0
board = nucleo_l432kc
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags = -Wall -Wextra

platform_packages =
    framework-stm32cubel4@1.18.1
    toolchain-gccarmnoneeabi@1.70201.0
    tool-ldscripts-ststm32@0.2.0

[env:acquisition_test]
extends = env:nucleo_l432kc
build_flags = -Wall -Wextra -DACQUISITION_TARGET_TEST
