[env:nucleo_l432kc]
platform = ststm32
board = nucleo_l432kc
framework = stm32cube
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select swd" -f target/stm32l4x.cfg -c "program {$PROG_PATH} verify reset exit"
