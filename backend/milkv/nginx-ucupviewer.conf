# Instalar como /etc/nginx/sites-available/ucupviewer y habilitar con symlink.
# Ajustar la ruta root según el artefacto compilado que entregue frontend.
server {
    listen 80;
    server_name _;
    root /var/www/ucupviewer;
    index index.html;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
